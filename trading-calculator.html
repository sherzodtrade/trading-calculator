<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Трейдинг Калькулятор · AB TRADE KG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D14;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:16px;font-family:Arial,sans-serif}
.w{width:100%;max-width:380px;background:#0D0D14;color:#E8E6E0;border-radius:20px;overflow:hidden;border:1px solid rgba(201,146,42,0.3);box-shadow:0 0 40px rgba(201,146,42,0.08)}
.hd{background:linear-gradient(135deg,#1A1A25,#14141F);padding:16px;border-bottom:1px solid rgba(201,146,42,0.2);display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;background:#C9922A;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#0D0D14;flex-shrink:0}
.tk{font-size:9px;color:#C9922A;letter-spacing:.2em}
.tt{font-size:17px;font-weight:700;color:#fff}
.pd{padding:12px 14px 0}
.lb{font-size:9px;color:#888780;letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tb{padding:11px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:#1C1C2A;color:#888780;font-size:14px;cursor:pointer;text-align:center;font-family:Arial,sans-serif;font-weight:700;transition:.15s;width:100%}
.tb.bon{background:rgba(29,158,117,.2);border-color:#1D9E75;color:#5DCAA5}
.tb.son{background:rgba(204,34,34,.2);border-color:#CC2222;color:#FF3B3B}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0}
.ig label{display:block;font-size:9px;color:#888780;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.ig input{width:100%;padding:11px 13px;background:#1C1C2A;border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#fff;font-size:18px;outline:none;font-family:Arial,sans-serif;font-weight:700;-webkit-appearance:none;appearance:none}
.ig input:focus{border-color:#C9922A}
.ig input::placeholder{color:rgba(255,255,255,.2)}
.ri{margin-top:8px;padding:7px 12px;background:#1C1C2A;border-radius:9px;border:1px solid rgba(255,255,255,0.06);font-size:10px;color:#888780;display:flex;justify-content:space-between;align-items:center}
.rok{color:#5DCAA5;font-weight:700}
.r60{color:#C9922A;font-weight:700}
.rno{color:#888780;font-weight:700}
.cs{margin-top:10px;display:flex;flex-direction:column;gap:7px;padding-bottom:4px}
.cd{border-radius:12px;border:1px solid rgba(255,255,255,0.07);background:#1A1A25;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;animation:fadeUp .25s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bg{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.c1 .bg{background:rgba(255,59,59,.12);color:#FF3B3B;border:1px solid rgba(255,59,59,.25)}
.c6 .bg{background:rgba(24,95,165,.15);color:#85B7EB;border:1px solid rgba(24,95,165,.25)}
.c4 .bg{background:rgba(83,74,183,.15);color:#AFA9EC;border:1px solid rgba(83,74,183,.25)}
.c7 .bg{background:rgba(29,158,117,.15);color:#5DCAA5;border:1px solid rgba(29,158,117,.25)}
.rt{display:flex;align-items:center;gap:8px}
.vl{font-size:20px;font-weight:700}
.c1 .vl{color:#FF3B3B}
.c6 .vl{color:#85B7EB}
.c4 .vl{color:#AFA9EC}
.c7 .vl{color:#5DCAA5}
.sg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;min-width:42px;text-align:center}
.sg.BUY{background:rgba(29,158,117,.2);color:#5DCAA5}
.sg.SELL{background:rgba(204,34,34,.2);color:#FF3B3B}
.em{text-align:center;padding:18px;color:#888780;font-size:11px;background:#1C1C2A;border-radius:12px;border:1px solid rgba(255,255,255,0.07);line-height:1.5}
.ft{text-align:center;padding:14px;font-size:9px;color:rgba(201,146,42,0.5);letter-spacing:.1em}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div class="w">
  <div class="hd">
    <div class="logo">Sh</div>
    <div>
      <div class="tk">XAUUSD · GOLD/USD</div>
      <div class="tt">Трейдинг Калькулятор</div>
    </div>
  </div>

  <div class="pd">
    <div class="lb">Направление рынка</div>
    <div class="tg">
      <button class="tb bon" id="b-up" onclick="sd('up')">▲ BUY</button>
      <button class="tb" id="b-dn" onclick="sd('down')">▼ SELL</button>
    </div>
  </div>

  <div class="pd">
    <div class="lb">Диапазон дня</div>
    <div class="r2">
      <div class="ig"><label>МАКСИМУМ</label><input type="number" id="hi" placeholder="4765" step="0.01" inputmode="decimal" oninput="cl()"></div>
      <div class="ig"><label>МИНИМУМ</label><input type="number" id="lo" placeholder="4682" step="0.01" inputmode="decimal" oninput="cl()"></div>
    </div>
    <div class="ri" id="rinfo" style="display:none">
      <span>Range: <b id="rval" style="color:#fff"></b></span>
      <span id="rbadge"></span>
    </div>
  </div>

  <div class="pd" style="padding-bottom:0">
    <div class="lb">Точки входа</div>
    <div class="cs" id="cs">
      <div class="em">Введи High и Low<br>— появятся точки входа —</div>
    </div>
  </div>

  <div class="ft">© Sherzod Akhrorov · @sheer_ex</div>
</div>

<script>
var d = 'up';

function sd(v) {
  d = v;
  document.getElementById('b-up').className = 'tb' + (v === 'up' ? ' bon' : '');
  document.getElementById('b-dn').className = 'tb' + (v === 'down' ? ' son' : '');
  cl();
}

function fm(n) { return n.toFixed(2); }

function row(cls, nm, val, sig, delay) {
  return '<div class="cd ' + cls + '" style="animation-delay:' + delay + 's">' +
    '<div class="bg">' + nm + '</div>' +
    '<div class="rt"><div class="vl">' + fm(val) + '</div>' +
    '<span class="sg ' + sig + '">' + sig + '</span></div></div>';
}

function cl() {
  var h = parseFloat(document.getElementById('hi').value);
  var l = parseFloat(document.getElementById('lo').value);
  var cs = document.getElementById('cs');
  var ri = document.getElementById('rinfo');

  if (isNaN(h) || isNaN(l) || h === l) {
    cs.innerHTML = '<div class="em">Введи High и Low<br>— появятся точки входа —</div>';
    ri.style.display = 'none';
    return;
  }

  var hi = Math.max(h, l), lo = Math.min(h, l);
  var R = hi - lo;

  ri.style.display = 'flex';
  document.getElementById('rval').textContent = R.toFixed(2);
  var rb = document.getElementById('rbadge');
  if (R >= 90)      { rb.textContent = '≥90 ✓'; rb.className = 'rok'; }
  else if (R >= 60) { rb.textContent = '≥60 ✓'; rb.className = 'r60'; }
  else              { rb.textContent = '<60';    rb.className = 'rno'; }

  var sig1 = d === 'up' ? 'SELL' : 'BUY';
  var sig2 = d === 'up' ? 'BUY'  : 'SELL';

  // Оригинальные формулы AB TRADE KG
  var f1 = d === 'up' ? hi + R / 2.6                          : lo - R / 2.6;
  var f6 = d === 'up' ? hi - Math.sqrt(R * 10 / 2.6) * 2.6   : lo + Math.sqrt(R * 10 / 2.6) * 2.6;
  var f4 = d === 'up' ? lo + Math.sqrt(R * 10) / 2.6          : hi - Math.sqrt(R * 10) / 2.6;
  var f7 = d === 'up' ? lo + Math.pow(R * 10, 1/2.6) * 2.6/2 : hi - Math.pow(R * 10, 1/2.6) * 2.6/2;

  var showF6 = R >= 60 && (d === 'up' ? f6 > f4 : f6 < f4);

  var html = row('c1', 'Разворот', f1, sig1, 0);
  if (showF6) html += row('c6', 'Коррекция', f6, sig2, 0.06);
  html += row('c4', 'Консолидация', f4, sig2, showF6 ? 0.12 : 0.06);
  if (R >= 90) html += row('c7', 'Бол.консолидация', f7, sig2, showF6 ? 0.18 : 0.12);

  cs.innerHTML = html;
}
</script>
</body>
</html>
